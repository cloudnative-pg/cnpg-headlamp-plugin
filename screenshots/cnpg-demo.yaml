# Demo for the README screenshots and the Logs tab. screenshots/demo.sh creates it; you can
# also apply it yourself with: kubectl create -f screenshots/cnpg-demo.yaml
#
# - Everything is in the cnpg-demo namespace, so it is easy to remove. 'demo.sh teardown'
#   only deletes a namespace with the label below.
# - 3 instances with 1Gi each, so the screenshots show replicas. Use 1 instance on a small laptop.
# - Uses the default storage class. 'demo.sh --storage-class NAME' picks another.
# - The log settings in the Cluster give the Logs tab connection and autovacuum lines.
# - The ScheduledBackup uses volume snapshots, so no object store is needed. Without the
#   VolumeSnapshot CRD the operator rejects it, so 'demo.sh create' leaves it out then.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-demo
  labels:
    app.kubernetes.io/part-of: cnpg-headlamp-plugin-demo
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo-pg-ha
  namespace: cnpg-demo
spec:
  instances: 3
  storage:
    size: 1Gi
  postgresql:
    parameters:
      log_connections: 'on'
      log_autovacuum_min_duration: '0'
  backup:
    volumeSnapshot:
      className: csi-hostpath-snapclass
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: demo-pg-ha-rw
  namespace: cnpg-demo
spec:
  cluster:
    name: demo-pg-ha
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: demo-db
  namespace: cnpg-demo
spec:
  cluster:
    name: demo-pg-ha
  name: demo-db
  owner: app
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: demo-daily
  namespace: cnpg-demo
spec:
  schedule: '0 0 0 * * *'
  cluster:
    name: demo-pg-ha
  backupOwnerReference: self
  method: volumeSnapshot
