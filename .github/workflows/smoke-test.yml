name: Smoke test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Checkout Headlamp
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/headlamp
          path: headlamp

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No cache: here. setup-node's npm cache saves the whole ~/.npm
          # directory for the job, and the "Install Headlamp backend +
          # frontend" step below runs `npm install` against the headlamp
          # checkout — scoping the cache *key* to this repo's own lockfile
          # still leaves the cache *contents* poisonable by that install.

      - uses: actions/setup-go@v7
        with:
          go-version-file: headlamp/backend/go.mod
          # cache defaults to true and would key/populate the Go module cache
          # from headlamp/backend/go.sum in the untrusted checkout above —
          # the same cache-poisoning vector removed from setup-node earlier
          # in this job.
          cache: false

      - name: Install Headlamp backend + frontend (skip Electron app/tools)
        working-directory: headlamp
        run: |
          npm install
          npm run frontend:install
          npm run backend:build

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: headlamp-test

      - name: Install CloudNativePG operator
        env:
          CNPG_VERSION: '1.30.0'
        run: |
          CNPG_BRANCH="release-${CNPG_VERSION%.*}"
          kubectl apply --server-side -f \
            "https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/${CNPG_BRANCH}/releases/cnpg-${CNPG_VERSION}.yaml"
          kubectl rollout status deployment -n cnpg-system cnpg-controller-manager --timeout=120s

      - name: Create a minimal Cluster (exercises the detail page)
        run: |
          kubectl create namespace cnpg-smoke-test
          cat <<'EOF' | kubectl apply -n cnpg-smoke-test -f -
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: smoke-test
          spec:
            instances: 1
            storage:
              size: 1Gi
          EOF
          # Only wait for the operator to report a first status, not for the instance
          # to become fully healthy/replicated — the detail page just needs a real object.
          for i in $(seq 1 30); do
            phase=$(kubectl get cluster smoke-test -n cnpg-smoke-test -o jsonpath='{.status.phase}' 2>/dev/null)
            if [ -n "$phase" ]; then
              echo "Cluster phase: $phase"; exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Cluster status"; kubectl describe cluster smoke-test -n cnpg-smoke-test; exit 1

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Deploy plugin build into Headlamp's plugins folder
        # Mirrors what `headlamp-plugin start` (watch mode) copies on every build — see
        # copyToPluginsFolder() in @kinvolk/headlamp-plugin/bin/headlamp-plugin.js. Doing it once
        # here instead of running the watcher is the CI equivalent of "build it once".
        run: |
          PLUGIN_NAME=$(node -p "require('./package.json').name.split('/').pop()")
          DEST="$HOME/.config/Headlamp/plugins/$PLUGIN_NAME"
          mkdir -p "$DEST"
          cp -r dist/* "$DEST/"
          cp package.json "$DEST/"

      - name: Start Headlamp (backend :4466, frontend :3000)
        working-directory: headlamp
        run: |
          nohup npm run start > ../headlamp.log 2>&1 &
          disown

      - name: Wait for Headlamp frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "frontend ready"; exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Headlamp frontend"; cat headlamp.log; exit 1

      - name: Start headless Chrome against the frontend (CDP :9222)
        run: |
          # frontend/src/helpers/isElectron.ts detects Electron partly via a user-agent substring
          # check. Headlamp's Home page (frontend/src/components/App/Home/index.tsx) auto-redirects
          # to the single configured cluster's generic Overview page whenever !isElectron() and
          # there's exactly one cluster — exactly this setup — which stomps every hash navigation
          # this check does before it ever reaches the plugin's own routes. Spoofing the UA sidesteps
          # that Headlamp-side special case without needing real Electron.
          nohup google-chrome --headless=new --disable-gpu --no-sandbox \
            --user-agent="Mozilla/5.0 Electron/32.0.0 Chrome Safari" \
            --remote-debugging-port=9222 http://localhost:3000 \
            > chrome.log 2>&1 &
          disown

      - name: Wait for Chrome DevTools endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9222/json >/dev/null; then
              echo "CDP endpoint ready"; exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for Chrome DevTools endpoint"; cat chrome.log; exit 1

      - name: Run live-load smoke check
        run: node scripts/cdp-verify.mjs

      - name: Dump Headlamp logs on failure
        if: failure()
        run: cat headlamp.log || true
