name: Build and publish testing plugin container image

on:
  push:
    branches: [main]

permissions:
  contents: read

# Do not interrupt an image push before its attestation completes.
concurrency:
  group: plugin-main-testing
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLUGIN: cnpg-headlamp-plugin
  FULL_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cnpg-headlamp-plugin-testing

jobs:
  build-and-publish:
    if: github.repository == 'cloudnative-pg/cnpg-headlamp-plugin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=main
          # Match release metadata; revision, created, source and version
          # are generated by metadata-action from this push event.
          labels: |
            org.opencontainers.image.title=CloudNativePG Headlamp Plugin
            org.opencontainers.image.description=Headlamp plugin for managing CloudNativePG resources - directly from the Headlamp
            org.opencontainers.image.vendor=CloudNativePG
            org.opencontainers.image.authors=The CloudNativePG Contributors
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://cloudnative-pg.io/documentation/
            org.opencontainers.image.url=https://github.com/cloudnative-pg/cnpg-headlamp-plugin
          # Custom labels are not automatically propagated to annotations.
          annotations: |
            org.opencontainers.image.title=CloudNativePG Headlamp Plugin
            org.opencontainers.image.description=Headlamp plugin for managing CloudNativePG resources - directly from the Headlamp
            org.opencontainers.image.vendor=CloudNativePG
            org.opencontainers.image.authors=The CloudNativePG Contributors
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://cloudnative-pg.io/documentation/
            org.opencontainers.image.url=https://github.com/cloudnative-pg/cnpg-headlamp-plugin

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 15
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PLUGIN=${{ env.PLUGIN }}
          cache-from: type=gha,scope=main-testing
          cache-to: type=gha,scope=main-testing,mode=max

      - name: Test plugin contents
        run: |
          docker run --rm "$FULL_IMAGE_NAME:main" sh -c \
            'test -s "/plugins/$1/main.js" && test -s "/plugins/$1/package.json"' sh "$PLUGIN"

      - name: Check whether this commit is still main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ -z "$MAIN_SHA" ]; then
            echo "Error: main ref returned an empty SHA" >&2
            exit 1
          fi
          # Concurrency does not guarantee commit ordering. This check reduces
          # stale publishes, but main can advance again during the image push.
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipped obsolete build $GITHUB_SHA; main is now $MAIN_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push Docker image
        id: push
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          build-args: PLUGIN=${{ env.PLUGIN }}
          cache-from: type=gha,scope=main-testing
          cache-to: type=gha,scope=main-testing,mode=max

      - name: Generate artifact attestation
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FULL_IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        id: summary
        if: steps.freshness.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Unstable Testing Image Published"
            echo "Image: $FULL_IMAGE_NAME:main"
            echo "Revision: $GITHUB_SHA"
            echo "Digest: $IMAGE_DIGEST"
            echo "Pinned image: $FULL_IMAGE_NAME@$IMAGE_DIGEST"
            echo "For pre-release testing only; not for production."
          } >> "$GITHUB_STEP_SUMMARY"
