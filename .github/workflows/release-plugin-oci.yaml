name: Build and publish plugin container image

on:
  # Automatic path: when release-please publishes a vX.Y.Z release,
  # build the tagged plugin source and publish its OCI image to GHCR.
  release:
    types: [published]
  # Manual path: retry a failed run (or cut a release without release-please)
  # by providing an existing tag such as v0.1.0.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}
  PLUGIN: cnpg-headlamp-plugin
  FULL_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cnpg-headlamp-plugin
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed for publishing the container image
      attestations: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: no tag resolved (release.tag_name or inputs.tag)" >&2
            exit 1
          fi
          if [ "${TAG#v}" = "$TAG" ]; then
            echo "Error: tag must be v-prefixed, got '$TAG'" >&2
            exit 1
          fi
          # Tags are v-prefixed (v0.1.0); the plugin version is not (0.1.0).
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG_VERSION=$TAG" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
        env:
          # Attach annotations to both manifests and the multi-arch index
          # so they are visible on GHCR, following cloudnative-pg/docker-bake.hcl
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG_VERSION }}
          # version, revision, created, source are auto-generated by
          # metadata-action. We only pin the stable descriptive fields here,
          # mirroring cloudnative-pg/docker-bake.hcl.
          labels: |
            org.opencontainers.image.title=CloudNativePG Headlamp Plugin
            org.opencontainers.image.description=Headlamp plugin for managing CloudNativePG resources - directly from the Headlamp
            org.opencontainers.image.vendor=CloudNativePG
            org.opencontainers.image.authors=The CloudNativePG Contributors
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://cloudnative-pg.io/documentation/
            org.opencontainers.image.url=https://github.com/cloudnative-pg/cnpg-headlamp-plugin
          # metadata-action does not propagate custom labels to annotations
          # automatically, so mirror them explicitly.
          annotations: |
            org.opencontainers.image.title=CloudNativePG Headlamp Plugin
            org.opencontainers.image.description=Headlamp plugin for managing CloudNativePG resources - directly from the Headlamp
            org.opencontainers.image.vendor=CloudNativePG
            org.opencontainers.image.authors=The CloudNativePG Contributors
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://cloudnative-pg.io/documentation/
            org.opencontainers.image.url=https://github.com/cloudnative-pg/cnpg-headlamp-plugin

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        timeout-minutes: 15
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          build-args: PLUGIN=${{ env.PLUGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: |
          docker run --rm ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG_VERSION }} sh -c "ls /plugins/${{ env.PLUGIN }}"

      - name: Push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          build-args: PLUGIN=${{ env.PLUGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    
      - name: Summary
        run: |
          echo "## Container Image Published" >> $GITHUB_STEP_SUMMARY
          echo "Plugin: ${{ env.PLUGIN }}" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG_VERSION }}" >> $GITHUB_STEP_SUMMARY

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 #v4.2.2
        with:
          subject-name: ${{ env.FULL_IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
